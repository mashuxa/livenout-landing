<body>

{id:1,title:'Вечер настольных игр',cat:'Игры',lang:'RU',day:'Сегодня',date:'17 нояб. · 19:00',place:'Варшава · Śródmieście',km:'4.2',price:35,going:7,goal:10,deadline:'17 нояб. · 17:00',own:false,community:true,color:'#53355c',image:'https://images.unsplash.com/photo-1610890716171-6b1bb98ffd09?w=800&auto=format&fit=crop&q=75',desc:'Камерная встреча для любителей настольных игр. Можно прийти одному — познакомимся и выберем игру вместе.'},
{id:2,title:'Творческий вечер · Керамика',cat:'Искусство',lang:'RU / UK',day:'Выходные',date:'21 нояб. · 17:00',place:'Варшава · Mokotów',km:'6.1',price:120,going:8,goal:12,deadline:'20 нояб. · 18:00',own:true,community:true,color:'#8b5140',image:'https://images.unsplash.com/photo-1565193298595-6ba6558241d9?w=800&auto=format&fit=crop&q=75',desc:'Мастер-класс по керамике для новичков. Материалы включены, небольшая группа, спокойная атмосфера.'},
{id:3,title:'Импровизация · Комедийное шоу',cat:'Развлечения',lang:'RU',day:'Выходные',date:'22 нояб. · 20:30',place:'Варшава · Wola',km:'5.8',price:60,going:24,goal:0,own:false,community:false,color:'#55312b',image:'https://images.unsplash.com/photo-1516280440614-37939bbacd81?w=800&auto=format&fit=crop&q=75',desc:'Живое комедийное шоу без сценария, с участием зрителей. Каждый вечер уникален.'},
{id:4,title:'Языковой клуб',cat:'Сообщество',lang:'PL / EN / UK',day:'Завтра',date:'18 нояб. · 18:00',place:'Варшава · Centrum',km:'3.3',price:0,going:6,goal:0,own:true,community:true,color:'#3f5262',image:'https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=800&auto=format&fit=crop&q=75',desc:'Общаемся на разных языках, знакомимся и практикуемся в дружеской атмосфере.'},
{id:5,title:'Быстрые свидания',cat:'Сообщество',lang:'RU / BY',day:'На неделе',date:'26 нояб. · 19:00',place:'Варшава · Nowogrodzka',km:'7.4',price:90,going:5,goal:12,deadline:'26 нояб. · 18:00',own:false,community:true,color:'#663e4f',image:'',desc:'12 участников, 6 пар и 6 шансов познакомиться с интересными людьми.'}];
let events=demos.map(x=>({...x})),mode='user',screen='home',selected=1,feedMode='list',sheetLevel=0,sheetHeight=155,mapX=0,mapY=0,zoom=1,query='',day='Все',cat='Все',lang='Все',free=false,community=false,liked=new Set([2]),joined=new Set([4]),seen=false,followed=false,orgFilter='Активные',prev='home',returnScreen='home',catalogTop=0;
const participants=[{name:'Александра К.',status:'Подтверждено'},{name:'Анна М.',status:'Подтверждено'},{name:'Дмитрий Р.',status:'Ожидает'},{name:'Ольга С.',status:'Подтверждено'}];

const notifications=[{title:'Языковой клуб — завтра',text:'Напоминание о вашей записи',event:4,role:'user',when:'10 мин назад'},{title:'Керамика — набрано 8 из 12',text:'Новая запись на ваше мероприятие',event:2,role:'org',when:'25 мин назад'},{title:'Новое сообщение в чате',text:'Языковой клуб',event:4,role:'both',when:'1 час назад'}];
const current=()=>events.find(e=>e.id===selected)||events[0];
const filtered=()=>events.filter(e=>!e.draft&&!e.cancelled&&(!community||e.community)&&(!free||!e.price)&&(day==='Все'||day===e.day)&&(cat==='Все'||cat===e.cat)&&(lang==='Все'||e.lang.includes(lang))&&(!query||[e.title,e.desc,e.cat,e.lang].join(' ').toLowerCase().includes(query.toLowerCase())));
const page=(title,body,back='')=>'<section class="page"><div class="pageTitle"><div class="row">'+(back?'<button class="back" aria-label="Назад" onclick="go(\''+back+'\')">‹</button>':'')+'<h1>'+title+'</h1></div></div>'+body+'</section>';
const btn=(label,action,secondary=false,inline=false)=>'<button type="button" class="'+(secondary?'secondary':'primary')+(inline?' inline':'')+'" onclick="'+action+'">'+label+'</button>';
const cover=e=>'<div class="cover" style="background-color:'+e.color+';'+(e.image?'background-image:linear-gradient(0deg,#0004,transparent),url('+e.image+')':'')+'"><span>'+esc(e.cat)+'</span></div>';

function card(e){return '<article class="event '+(e.goal?'promoted':'')+'" onclick="openEvent('+e.id+')"><div class="row between"><span class="eventTitle">'+esc(e.title)+'</span>'+like(e)+'</div><div class="eventInfo">'+cover(e)+'<div><span class="tag">'+esc(e.cat)+'</span> <small>'+esc(e.lang)+'</small><p class="desc">'+esc(e.desc)+'</p><b>'+ (e.price?e.price+' zł':'Бесплатно')+'</b></div></div><div class="eventFoot"><span>◷ '+esc(e.date)+'</span><span>⌖ '+e.km+' km</span></div>'+(e.goal?progress(e):'')+'</article>'}

function go(s){if(screen==='catalog'&&$('#feedcontent'))catalogTop=$('#feedcontent').scrollTop;screen=s;closeModal();render()}
function openEvent(id){selected=id;returnScreen=screen;go('detail')}
function manage(id){selected=id;go('manage')}
function openChat(id){selected=id;go('chat')}
function toggleLike(id){liked.has(id)?liked.delete(id):liked.add(id);const pos=$('#feedcontent')?.scrollTop||0;render();if($('#feedcontent'))$('#feedcontent').scrollTop=pos}
function toast(text){const t=$('#toast');t.textContent=text;t.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.add('hidden'),2300)}
function modal(title,body){$('#overlay').innerHTML='<section class="modal" role="dialog" aria-modal="true"><div class="pageTitle"><h2>'+title+'</h2><button class="icon" aria-label="Закрыть" onclick="closeModal()">✕</button></div>'+body+'</section>';$('#overlay').classList.remove('hidden')}
function closeModal(){$('#overlay').classList.add('hidden')}
function chip(text,on,action){return '<button class="chip '+(on?'on':'')+'" onclick="'+action+'">'+text+'</button>'}

function pickDay(v){day=v;render()}

function openCatalog(){catalogTop=0;go('catalog')}
function searchEvents(){query=$('#smart').value.trim();openCatalog()}
function filterModal(){modal('Фильтры','<form class="form" onsubmit="event.preventDefault();day=this.day.value;cat=this.cat.value;lang=this.lang.value;free=this.free.checked;community=this.community.checked;closeModal();render()"><label>Дата<select name="day">'+opts(['Все','Сегодня','Завтра','Выходные','На неделе'],day)+'</select></label><label>Категория<select name="cat">'+opts(['Все','Игры','Искусство','Развлечения','Сообщество'],cat)+'</select></label><label>Язык<select name="lang">'+opts(['Все','RU','UK','BY','PL','EN'],lang)+'</select></label><label class="check"><input name="free" type="checkbox" '+(free?'checked':'')+'>Только бесплатные</label><label class="check"><input name="community" type="checkbox" '+(community?'checked':'')+'>От сообщества</label><button class="primary">Показать события</button>'+btn('Сбросить','resetFilters()',true)+'</form>')}
function resetFilters(){query='';day=cat=lang='Все';free=community=false;closeModal();render()}
function opts(arr,v){return arr.map(x=>'<option '+(x===v?'selected':'')+'>'+esc(x)+'</option>').join('')}
function home(){const list=filtered();return '<section class="map" id="map"><div class="maplayer" id="maplayer" style="transform:translate('+mapX+'px,'+mapY+'px) scale('+zoom+')"><span class="maplabel" style="top:25%;left:30%">Łomianki</span><span class="maplabel" style="top:42%;left:44%;font-size:21px">Warszawa</span><span class="maplabel" style="top:66%;left:22%">Pruszków</span><span class="maplabel" style="top:70%;left:65%">Piaseczno</span>'+list.map((e,i)=>'<button class="marker '+(i>2?'point':'')+'" style="top:'+([34,49,60,26,68][i%5])+'%;left:'+([45,61,35,76,78][i%5])+'%" onclick="selected='+e.id+';openCatalog();setTimeout(()=>document.getElementById(\'evt-'+e.id+'\')?.scrollIntoView({block:\'start\'}),50)">'+(i>2?'1':e.going)+'</button>').join('')+'</div></section><div class="maptop"><div class="chips">'+['Все','Сегодня','Завтра','Выходные'].map(x=>chip(x,day===x,"pickDay('"+x+"')")).join('')+chip('Бесплатно',free,'free=!free;render()')+'</div><div class="row between"><div class="chips">'+chip('Все события',!community,'community=false;render()')+chip('От сообщества',community,'community=true;render()')+'</div><button class="icon" style="background:#141926;color:#ff84b0" aria-label="Фильтры" onclick="filterModal()">'+ico('filter')+'</button></div></div><div class="mapcontrols"><button onclick="zoom=Math.min(2,zoom+.2);render()" aria-label="Приблизить">+</button><button onclick="zoom=Math.max(.8,zoom-.2);render()" aria-label="Отдалить">−</button><button onclick="mapX=mapY=0;zoom=1;render()" aria-label="Моя область">⌖</button></div><button id="mapcount" class="mapcount" onclick="openCatalog()">События в этой области ('+list.length+')</button><section class="sheet" id="sheet"><div class="grip" id="grip" aria-label="Размер шторки" role="button" tabindex="0"></div><div class="sheethead"><div class="row between"><h2>⌖ События рядом</h2><button class="switcher" onclick="setSheet((sheetLevel+1)%3)">Развернуть</button></div><div class="chips" style="margin-top:9px">'+['Все','Игры','Искусство','Сообщество'].map(x=>chip(x,cat===x,"applyFilter('cat','"+x+"')")).join('')+'</div></div><div class="sheetbody stack"><form class="search" onsubmit="event.preventDefault();searchEvents()"><input id="smart" placeholder="Чем хочешь заняться?" value="'+esc(query)+'"><button aria-label="Умный поиск">✦</button></form>'+btn('Открыть каталог ('+list.length+')','openCatalog()',true)+list.map(card).join('')+'</div></section>'}
function catalog(){const list=filtered();return '<div class="feedwrap"><div class="feedbar"><button onclick="go(\'home\')">‹ Изменить область поиска</button><div class="row"><button class="icon" style="color:'+(feedMode==='list'?'#ff8a3d':'#a0a6b8')+'" onclick="feedMode=\'list\';catalogTop=0;render()" aria-label="Список">'+ico('list')+'</button><button class="icon" style="color:'+(feedMode==='large'?'#ff8a3d':'#a0a6b8')+'" onclick="feedMode=\'large\';catalogTop=0;render()" aria-label="Карточки">▣</button><button class="icon" onclick="filterModal()" aria-label="Фильтры">'+ico('filter')+'</button></div></div><div id="feedcontent" class="feedcontent '+(feedMode==='large'?'largefeed':'')+'">'+(!list.length?'<div class="empty">Ничего не найдено.<br><br>'+btn('Оставить запрос','requestModal()')+btn('Сбросить фильтры','resetFilters()',true)+'</div>':feedMode==='list'?'<div class="list">'+list.map(e=>'<div id="evt-'+e.id+'">'+card(e)+'</div>').join('')+'</div>':list.map(e=>'<article class="feeditem" id="evt-'+e.id+'">'+cover(e)+'<div class="row between"><h2>'+esc(e.title)+'</h2>'+like(e)+'</div><div class="date">'+esc(e.date)+' · '+esc(e.place)+'</div><div class="row"><span class="tag">'+esc(e.cat)+'</span><small>'+esc(e.lang)+'</small></div><p class="muted">'+esc(e.desc)+'</p>'+progress(e)+'<div class="row">'+btn('Детали','openEvent('+e.id+')',true)+btn('Чат','openChat('+e.id+')',true)+'</div>'+btn(joined.has(e.id)?'Вы записаны':'Присоединиться','selected='+e.id+';joinModal()')+'</article>').join(''))+'</div></div>'}
function detail(){const e=current();return page('', '<div class="detailcover">'+cover(e).replace('class="cover"','class="cover" style-dummy=""').replace('min-height:120px','')+'</div><div class="row between"><h1>'+esc(e.title)+'</h1>'+like(e)+'</div><br>'+progress(e)+'<div class="stack section"><div class="fact">◷ <div><small>Дата и время</small><strong>'+esc(e.date)+'</strong></div></div><div class="fact">⌖ <div><small>Место</small><strong>'+esc(e.place)+'</strong></div></div><button class="fact" onclick="go(\'organizer\')"><span class="avatar">EH</span><div style="text-align:left"><small>Организатор</small><strong>'+ (e.own?'Event Hunter':'Warsaw Community')+'</strong></div><span style="margin-left:auto">›</span></button></div><h2 class="section">О событии</h2><div class="row"><span class="tag">'+esc(e.cat)+'</span><small>'+esc(e.lang)+'</small></div><p style="margin:12px 0">'+esc(e.desc)+'</p><b>'+ (e.price?e.price+' zł':'Бесплатно')+'</b><div class="sticky stack">'+btn(mode==='org'&&e.own?'Управление':joined.has(e.id)?'Вы записаны · Подробнее':'Участвовать',mode==='org'&&e.own?'manage('+e.id+')':'joinModal()')+btn('Групповой чат','openChat('+e.id+')',true)+btn('Поделиться','shareEvent()',true)+'</div>',returnScreen||'home')}
function joinModal(){const e=current();if(joined.has(e.id)){modal('Ваша запись','<div class="stack"><h3>'+esc(e.title)+'</h3><span class="status '+(e.goal&&e.going<e.goal?'wait':'')+'">'+(e.goal&&e.going<e.goal?'Ожидаем набора':'Запись подтверждена')+'</span>'+btn('Групповой чат','openChat('+e.id+')')+btn('Отменить участие','cancelJoin()',true)+'</div>');return}modal('Подтверждение участия','<form class="form" onsubmit="event.preventDefault();confirmJoin()"><h3>'+esc(e.title)+'</h3><small>'+esc(e.date)+' · '+esc(e.place)+'</small>'+progress(e)+'<div class="fact"><strong>'+(e.price?e.price+' zł':'Бесплатно')+'</strong><small>1 место</small></div>'+(e.goal?'<p class="notice">Событие состоится, если наберётся '+e.goal+' участников. Оплата и правила в этом демо не выполняются.</p>':'')+'<label class="check"><input required type="checkbox">Я принимаю условия участия и понимаю, что это демонстрация.</label><button class="primary">Подтвердить запись</button></form>')}
function confirmJoin(){const e=current();if(!joined.has(e.id)){joined.add(e.id);e.going++;}go('my');toast('Вы записаны · демо')}
function cancelJoin(){const e=current();if(joined.delete(e.id))e.going=Math.max(0,e.going-1);go('my');toast('Запись отменена')}
function shareEvent(){modal('Поделиться событием','<p class="muted">Демонстрационная ссылка</p><p style="word-break:break-all;margin:10px 0">https://livenout.example/events/'+selected+'</p>'+btn('Скопировать (демо)','toast(\'Ссылка подготовлена (демо)\');closeModal()'))}
function requestModal(){modal('Запрос на мероприятие','<form class="form" onsubmit="event.preventDefault();closeModal();toast(\'Запрос сохранён (демо)\')"><label>Чем хотите заняться?<textarea required placeholder="Например, керамика на русском в выходные"></textarea></label><label>Когда<select><option>Любое время</option><option>Выходные</option><option>Будни</option></select></label><button class="primary">Оставить запрос</button><small>Прототип новой функции. Организаторы увидят агрегированный спрос.</small></form>')}
function my(){const arr=events.filter(e=>joined.has(e.id));return page('Мои события','<div class="stack">'+(arr.length?arr.map(card).join(''):'<div class="empty">Пока нет записей.</div>')+btn('Найти мероприятие','go(\'home\')',true)+'</div>')}
function favorites(){return page('Избранное','<div class="stack">'+(events.filter(e=>liked.has(e.id)).map(card).join('')||'<div class="empty">Сохраните понравившиеся события.</div>')+'</div>')}
function chats(){const arr=events.filter(e=>mode==='org'?e.own:joined.has(e.id));return page('Чаты мероприятий',arr.map(e=>'<button class="entry" onclick="openChat('+e.id+')"><span class="avatar">#</span><div><b>'+esc(e.title)+'</b><small>'+esc(messages[e.id]?.at(-1)?.text||'Сообщений пока нет')+'</small></div><span>›</span></button>').join('')||'<div class="empty">Чаты появятся после записи.</div>')}
function chat(){const e=current();return '<section class="chat"><div class="pageTitle"><div class="row"><button class="back" onclick="go(\'chats\')">‹</button><div><h3>'+esc(e.title)+'</h3><small>Групповой чат · '+e.going+' участников</small></div></div></div><div class="messages" id="messages">'+((messages[e.id]||[]).map(m=>'<div class="bubble '+(m.mine?'mine':'')+'"><b>'+esc(m.name)+'</b><p>'+esc(m.text)+'</p><small>'+esc(m.time)+'</small></div>').join('')||'<div class="empty">Сообщений пока нет. Начните разговор!</div>')+'</div><form class="chatinput" onsubmit="event.preventDefault();sendMessage(this.msg.value)"><input name="msg" required placeholder="Напишите сообщение…"><button class="primary" aria-label="Отправить">➤</button></form></section>'}
function sendMessage(t){if(!t.trim())return;(messages[selected]??=[]).push({name:mode==='org'?'Event Hunter':'Вы',text:t,time:'Сейчас',mine:true});render();$('#messages').scrollTop=$('#messages').scrollHeight}
function notifs(){seen=true;return page('Уведомления','<small>Все сообщения демонстрационные</small>'+notifications.filter(n=>n.role===mode||n.role==='both').map(n=>'<button class="entry" onclick="'+(mode==='org'&&events.find(e=>e.id===n.event)?.own?'manage('+n.event+')':'openEvent('+n.event+')')+'"><span class="avatar">●</span><div><b>'+esc(n.title)+'</b><small>'+esc(n.text)+'</small><small>'+esc(n.when)+'</small></div><span>›</span></button>').join('')+btn('Настройки уведомлений','notificationSettings()',true))}
function notificationSettings(){modal('Уведомления','<div class="form">'+['Напоминания о событиях','Изменения и отмены','Статус All or Nothing','Новые сообщения',mode==='org'?'Новые записи':'События по интересам'].map(t=>'<label class="check"><input type="checkbox" checked>'+t+'</label>').join('')+btn('Сохранить','closeModal();toast(\'Настройки сохранены (демо)\')')+'</div>')}
function profile(){return page('Профиль','<div class="card row"><div class="avatar">EH</div><div><h2>Event Hunter</h2><small>Участник + организатор · Демо</small></div></div><h2 class="section">Аккаунт</h2><div class="stack">'+btn('Режим '+(mode==='user'?'организатора':'участника'),"switchRole('"+(mode==='user'?'org':'user')+"')")+btn('Настройки уведомлений','notificationSettings()',true)+btn('Мои интересы и запросы','go(\'interests\')',true)+'</div><div class="notice section">Полный кабинет, Stripe Connect и расширенная аналитика остаются в веб-версии. Авторизация здесь не требуется.</div>')}
function interests(){return page('Мои интересы','<div class="stack"><div class="card"><b>Керамика · Варшава</b><p class="muted">Выходные · уведомлять о новых событиях</p></div><div class="card"><b>Настольные игры</b><p class="muted">RU / UK · уведомлять о новых событиях</p></div>'+btn('Добавить запрос','requestModal()')+'<small>Будущий Demand-driven сценарий, только демонстрация.</small></div>','profile')}
function organizer(){const e=current();return page('Организатор','<div class="card row"><span class="avatar">EH</span><div><h2>'+ (e.own?'Event Hunter':'Warsaw Community')+'</h2><small>Локальные мероприятия</small></div></div><div class="section">'+btn(followed?'Вы подписаны':'Подписаться','followed=!followed;render()',followed)+'</div><h2 class="section">Предстоящие события</h2><div class="stack">'+events.filter(x=>x.own===e.own).map(card).join('')+'</div>','detail')}
function orgEvents(){const arr=events.filter(e=>e.own);return page('Мои события','<div class="stats"><div class="stat"><small>Активные</small><strong>'+arr.filter(e=>!e.cancelled&&!e.draft).length+'</strong></div><div class="stat"><small>Записи</small><strong>'+arr.reduce((s,e)=>s+e.going,0)+'</strong></div></div><div class="section chips">'+['Активные','Черновики','Завершённые'].map(x=>chip(x,orgFilter===x,"orgFilter='"+x+"';render()")).join('')+'</div><div class="stack">'+(arr.filter(e=>orgFilter==='Черновики'?e.draft:orgFilter==='Завершённые'?e.cancelled:!e.draft&&!e.cancelled).map(e=>'<div class="card stack"><div class="row between"><h3>'+esc(e.title)+'</h3><span class="status '+(e.goal&&e.going<e.goal?'wait':'')+'">'+(e.draft?'Черновик':e.cancelled?'Отменено':e.goal&&e.going<e.goal?'Набор':'Активно')+'</span></div><small>'+esc(e.date)+'</small>'+progress(e)+btn('Управление','manage('+e.id+')')+'<div class="row">'+btn('Участники','selected='+e.id+';go(\'participants\')',true)+btn('Напомнить','selected='+e.id+';reminderModal()',true)+'</div></div>').join('')||'<div class="empty">Нет событий в этом разделе.</div>')+btn('+ Создать событие','go(\'create\')')+'</div>')}
function managePage(){const e=current();return page('Управление событием','<div class="stack"><div class="card stack"><h2>'+esc(e.title)+'</h2><small>'+esc(e.date)+' · '+esc(e.place)+'</small>'+progress(e)+'</div><div class="stats"><div class="stat"><small>Участники</small><strong>'+e.going+'</strong></div><div class="stat"><small>Свободные места</small><strong>'+(e.goal?Math.max(0,e.goal-e.going):'—')+'</strong></div></div>'+btn('Управление участниками','go(\'participants\')')+btn('Отправить напоминание','reminderModal()',true)+btn('Групповой чат','openChat('+e.id+')',true)+btn('Редактировать','go(\'edit\')',true)+btn('Дублировать','duplicateEvent()',true)+btn('Поделиться','shareEvent()',true)+btn('Просмотр карточки','openEvent('+e.id+')',true)+btn('Отменить событие','cancelEvent()',true)+'</div>','orgEvents')}
function participantsPage(){const e=current();return page('Участники','<div class="card"><h3>'+esc(e.title)+'</h3>'+progress(e)+'</div><p class="muted section">Демо-список участников</p>'+participants.map((p,i)=>'<div class="entry"><span class="avatar">'+esc(p.name[0])+'</span><div><b>'+esc(p.name)+'</b><small>'+esc(p.status)+'</small></div><button class="chip" onclick="participantModal('+i+')">Изменить</button></div>').join('')+'<div class="section">'+btn('Напоминание всем','reminderModal()')+'</div>','manage')}
function participantModal(i){modal('Статус участия','<div class="stack">'+['Подтверждено','Ожидает','Отменено','Посетил'].map(s=>btn(s,"participants["+i+"].status='"+s+"';closeModal();render()",true)).join('')+'</div>')}
function reminderModal(){modal('Напоминание участникам','<form class="form" onsubmit="event.preventDefault();closeModal();toast(\'Напоминание отправлено (демо)\')"><h3>'+esc(current().title)+'</h3><small>Получатели: '+current().going+' записавшихся</small><label>Сообщение<textarea required>Напоминаем о мероприятии! До встречи.</textarea></label><button class="primary">Отправить напоминание</button><small>В демо уведомления не доставляются.</small></form>')}
function createPage(edit=false){const e=edit?current():{};return page(edit?'Редактирование':'Создать событие','<form class="form" onsubmit="event.preventDefault();saveEvent(this,'+edit+',event.submitter)"><label>Название<input name="title" required value="'+esc(e.title||'')+'" placeholder="Название события"></label><label>Описание<textarea required name="desc" placeholder="Что будет происходить?">'+esc(e.desc||'')+'</textarea></label><label>Категория<select name="cat">'+opts(['Игры','Искусство','Развлечения','Сообщество'],e.cat||'Сообщество')+'</select></label><label>Дата и время<input name="date" required value="'+esc(e.date||'')+'" placeholder="21 нояб. · 17:00"></label><label>Место<input name="place" required value="'+esc(e.place||'Варшава')+'"></label><label>Языки<input name="lang" value="'+esc(e.lang||'RU')+'"></label><label>Цена, zł<input name="price" type="number" min="0" value="'+(e.price||0)+'"></label><label class="check"><input name="aon" type="checkbox" '+(e.goal?'checked':'')+' onchange="document.getElementById(\'aonFields\').classList.toggle(\'hidden\',!this.checked)">All or Nothing — проверка спроса</label><div class="form '+(e.goal?'':'hidden')+'" id="aonFields"><label>Минимум участников<input name="goal" type="number" min="1" value="'+(e.goal||10)+'"></label><label>Дедлайн набора<input name="deadline" value="'+esc(e.deadline||'')+'" placeholder="20 нояб. · 18:00"></label></div><button class="primary">'+(edit?'Сохранить':'Опубликовать (демо)')+'</button><button type="submit" name="draft" value="1" class="secondary">Сохранить черновик</button></form>',edit?'manage':'orgEvents')}
function saveEvent(f,edit,submitter){const data=Object.fromEntries(new FormData(f)),base=edit?current():{id:Math.max(...events.map(x=>x.id))+1,going:0,own:true,community:true,color:'#70415f',image:'',km:'0.5',day:'На неделе'};Object.assign(base,{title:data.title,desc:data.desc,cat:data.cat,date:data.date,place:data.place,lang:data.lang,price:Number(data.price),goal:data.aon?Number(data.goal):0,deadline:data.deadline,draft:submitter?.name==='draft'});if(!edit)events.push(base);selected=base.id;go('orgEvents');toast(base.draft?'Черновик сохранён':'Событие сохранено (демо)')}
function duplicateEvent(){const e={...current(),id:Math.max(...events.map(x=>x.id))+1,title:current().title+' — копия',going:0,draft:true,cancelled:false};events.push(e);selected=e.id;go('edit');toast('Копия создана')}
function cancelEvent(){modal('Отменить событие?','<p class="muted">Это действие изменит только моковые данные.</p><br>'+btn('Подтвердить отмену','current().cancelled=true;go(\'orgEvents\');toast(\'Событие отменено (демо)\')')+btn('Назад','closeModal()',true))}
const userNav=[['home','map','Афиша'],['favorites','heart','Избранное'],['my','ticket','Мои события'],['chats','chat','Чаты'],['profile','user','Профиль']];
const orgNav=[['orgEvents','calendar','События'],['create','plus','Создать'],['chats','chat','Чаты'],['notifications','bell','Уведомления'],['profile','user','Профиль']];
function render(){if(!['home','catalog','detail','organizer','my','favorites','chats','chat','notifications','profile','interests','orgEvents','manage','participants','create','edit'].includes(screen))screen='home';$('#roleUser').classList.toggle('on',mode==='user');$('#roleOrg').classList.toggle('on',mode==='org');$('#headChat').innerHTML=ico('chat');$('#headBell').innerHTML=ico('bell')+(seen?'':'<i class="dot"></i>');$('#headProfile').innerHTML=ico('user');const views={home,catalog,detail,my,favorites,chats,chat,notifications:notifs,profile,interests,organizer,orgEvents,manage:managePage,participants:participantsPage,create:()=>createPage(),edit:()=>createPage(true)};$('#view').innerHTML=views[screen]();$('#nav').innerHTML=(mode==='user'?userNav:orgNav).map(([s,i,t])=>'<button class="'+(screen===s||(s==='home'&&screen==='catalog')||(s==='orgEvents'&&['manage','participants','edit'].includes(screen))||(s==='chats'&&screen==='chat')?'on':'')+'" onclick="go(\''+s+'\')">'+ico(i)+'<span>'+t+'</span></button>').join('');if(screen==='home')bindMap();if(screen==='catalog')$('#feedcontent').scrollTop=catalogTop;if(screen==='chat')$('#messages').scrollTop=$('#messages').scrollHeight}
function bindMap(){setSheet(sheetLevel);const grip=$('#grip'),sheet=$('#sheet');let sy=0,start=0,drag=false;grip.onpointerdown=e=>{sy=e.clientY;start=sheetHeight;drag=true;sheet.classList.add('dragging');grip.setPointerCapture(e.pointerId)};grip.onpointermove=e=>{if(!drag)return;sheetHeight=Math.max(100,Math.min($('#view').clientHeight*.9,start+sy-e.clientY));sheet.style.height=sheetHeight+'px';$('#mapcount').style.bottom=sheetHeight+15+'px'};function finish(e){if(!drag)return;drag=false;sheet.classList.remove('dragging');const delta=sy-e.clientY;if(Math.abs(delta)<8)setSheet((sheetLevel+1)%3);else setSheet(Math.max(0,Math.min(2,sheetLevel+(delta>0?1:-1))))}grip.onpointerup=finish;grip.onpointercancel=()=>{drag=false;sheet.classList.remove('dragging');setSheet(sheetLevel)};grip.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setSheet((sheetLevel+1)%3)}};const map=$('#map');let startX,startY,ox,oy,moving=false;map.onpointerdown=e=>{if(e.target.closest('button'))return;startX=e.clientX;startY=e.clientY;ox=mapX;oy=mapY;moving=true;map.setPointerCapture(e.pointerId)};map.onpointermove=e=>{if(moving){mapX=Math.max(-100,Math.min(100,ox+e.clientX-startX));mapY=Math.max(-100,Math.min(100,oy+e.clientY-startY));$('#maplayer').style.transform='translate('+mapX+'px,'+mapY+'px) scale('+zoom+')'}};map.onpointerup=map.onpointercancel=()=>moving=false}
$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))closeModal()});render();
</script>
</body>
