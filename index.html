<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
  <div class="relative w-dvw h-dvh overflow-hidden">
    <div id="screens" class="flex flex-row size-full translate-x-0 transition-transform duration-300 ease-in-out">
      <section
        id="map"
        class="relative size-full shrink-0 bg-neutral-900 bg-cover bg-center"
        style="background-image: url('https://livenout.com/images/map-dark.jpg')"
      ></section>

      <section id="feed" class="size-full shrink-0 bg-neutral-950"></section>
    </div>
  </div>

  <script>
    const screens = document.getElementById('screens');
    const map = document.getElementById('map');
    const feed = document.getElementById('feed');

    let onFeeds = false;

    function updateScreens() {
      screens.classList.toggle('translate-x-0', !onFeeds);
      screens.classList.toggle('-translate-x-[100dvw]', onFeeds);
    }

    map.addEventListener('click', () => {
      onFeeds = true;
      updateScreens();
    });

    feed.addEventListener('click', () => {
      onFeeds = false;
      updateScreens();
    });
  </script>
</body>
</html>
